- type: entity
  name: "полезный красный бургер"
  description: "Выглядит очень... полезным? Выглядит как ответ на все проблемы человечества."
  parent: PrettyBurgerRed
  id: BeelzebubBurgerRed
  components:
   - type: PointLight
     color: "#CC0000FF"
     energy: 15
     radius: 3
   - type: Godmode
   - type: RandomWalk
     maxSpeed: 5
     minSpeed: 5
   - type: MovementIgnoreGravity
     weightless: true
   - type: SolutionContainerManager
     solutions:
      food: 
       maxVol: 5000000
       reagents:
        - ReagentId: GreenTea
          Quantity: 1000000
        - ReagentId: JuiceBerry
          Quantity: 1000000
        - ReagentId: Whiskey
          Quantity: 1000000
        - ReagentId: Omnizine
          Quantity: 1000000
        - ReagentId: WhiskeyCola
          Quantity: 1000000
   - type: FlavorProfile
     flavors:
      - bun
      - meaty
      - sweet
      - holy
     ignoreReagents:
      - GreenTea
      - JuiceBerry
      - Whiskey
      - Omnizine
      - WhiskeyCola

- type: entity
  name: "урановый зелёный бургер"
  description: "От него очень сильно фонит."
