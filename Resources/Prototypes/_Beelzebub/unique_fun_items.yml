  components:
   - type: PointLight
     color: "#52FF39FF"
     energy: 10
     radius: 2
   - type: RandomWalk
     maxSpeed: 5
     minSpeed: 5
   - type: MovementIgnoreGravity
     weightless: true
   - type: SolutionContainerManager
     solutions:
      food: 
       maxVol: 50
       reagents:
        - ReagentId: Uranium
          Quantity: 50
   - type: RadiationSource
     enabled: true
     intensity: 20
     slope: 4
     
